server:
  port: 8081

spring:
  application:
    name: user-auth-service
  data:
    mongodb:
      # Connection string for MongoDB (Local database)
      uri: mongodb://localhost:27017/authdb

app:
  security:
    # Custom API key to secure the microservice endpoints
    api-key: ${CUSTOM_API_KEY}

springdoc:
  swagger-ui:
    # URL path to access Swagger UI documentation
    path: /swagger-ui.html